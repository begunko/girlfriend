<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подружка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #2a1f1a; }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #2a1f1a;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            padding: 12px 0;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">💕 Загрузка...</div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        console.log('🚀 Супер-фикс версия...');

        const container = document.getElementById('canvas-container');
        const canvas = document.createElement('canvas');
        container.appendChild(canvas);

        // ============================================================
        // ЖЕСТКО ЗАДАЁМ РАЗМЕРЫ CANVAS В ПИКСЕЛЯХ
        // ============================================================
        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            if (engine) {
                engine.resize();
            }
            console.log(`📐 Ресайз: ${width}x${height}`);
        }

        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.16, 0.12, 0.10, 1);

        const camera = new BABYLON.ArcRotateCamera(
            'camera', 
            Math.PI / 2, 
            Math.PI / 3, 
            6, 
            new BABYLON.Vector3(0, 0.5, 0), 
            scene
        );
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 2;
        camera.upperRadiusLimit = 10;

        const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.9;
        light.diffuse = new BABYLON.Color3(1, 0.9, 0.8);

        const fillLight = new BABYLON.DirectionalLight('fillLight', new BABYLON.Vector3(-1, 0.5, 1), scene);
        fillLight.intensity = 0.5;

        // Куб
        const box = BABYLON.MeshBuilder.CreateBox('box', { size: 1.2 }, scene);
        box.position.y = 0.6;
        const material = new BABYLON.StandardMaterial('mat', scene);
        material.diffuseColor = new BABYLON.Color3(1, 0.4, 0.6);
        material.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
        box.material = material;

        // Пол
        const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 4, height: 4 }, scene);
        ground.position.y = 0;
        const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
        groundMat.diffuseColor = new BABYLON.Color3(0.3, 0.25, 0.2);
        ground.material = groundMat;

        document.getElementById('info').innerHTML = '💕 Привет, я твоя подружка!';

        // ============================================================
        // РЕНДЕРИНГ
        // ============================================================
        engine.runRenderLoop(() => {
            box.rotation.x += 0.005;
            box.rotation.y += 0.01;
            scene.render();
        });

        // ============================================================
        // ВЫЗЫВАЕМ РЕСАЙЗ ПРИ ЗАГРУЗКЕ И ПРИ ИЗМЕНЕНИИ РАЗМЕРА
        // ============================================================
        window.addEventListener('resize', resizeCanvas);
        
        // Вызываем сразу, потом через 0.5 сек и через 2 сек (для надежности)
        resizeCanvas();
        setTimeout(resizeCanvas, 500);
        setTimeout(resizeCanvas, 2000);

        console.log('✅ Супер-фикс версия запущена!');
    </script>
</body>
</html>
