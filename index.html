<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Тест Babylon.js (Ступенька 1)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; }
        #info { position: absolute; top: 10px; left: 10px; color: white; font-family: Arial; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; z-index: 10; }
    </style>
    <!-- Подключаем Babylon.js С ТОЛЬКО ЯДРОМ (без загрузчиков) -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="info">⏳ Загрузка...</div>
    <canvas id="canvas" style="width:100vw;height:100vh;display:block;"></canvas>

    <script>
        // ============================================================
        // СТУПЕНЬКА 1: Просто куб
        // ============================================================
        console.log('🚀 Начинаем тест...');

        const canvas = document.getElementById('canvas');
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        // Камера
        const camera = new BABYLON.ArcRotateCamera(
            'camera',
            Math.PI / 2,
            Math.PI / 3,
            5,
            BABYLON.Vector3.Zero(),
            scene
        );
        camera.attachControl(canvas, true);

        // Свет
        const light = new BABYLON.HemisphericLight(
            'light',
            new BABYLON.Vector3(0, 1, 0),
            scene
        );
        light.intensity = 0.8;

        // Куб
        const box = BABYLON.MeshBuilder.CreateBox('box', { size: 1.5 }, scene);
        box.position.y = 0.75;

        // Пол (чтобы было видно тень)
        const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 4, height: 4 }, scene);
        ground.position.y = 0;

        document.getElementById('info').innerHTML = '✅ Куб загружен! (Ступенька 1)';

        // Рендеринг
        engine.runRenderLoop(() => {
            // Анимация вращения куба
            box.rotation.x += 0.01;
            box.rotation.y += 0.02;
            scene.render();
        });

        window.addEventListener('resize', () => engine.resize());

        console.log('✅ Тест 1 завершён');
    </script>
</body>
</html>
