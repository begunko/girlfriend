<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Моя Подружка</title>
    <!-- Подключаем VK Bridge -->
    <script src="https://vk.com/js/api/openapi.js?169"></script>
    <!-- Подключаем Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #f0e6d3;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #5a3d2b;
        font-size: 18px;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        pointer-events: none;
        background: rgba(255, 248, 240, 0.6);
        padding: 10px 0;
        backdrop-filter: blur(4px);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="info">Привет, я твоя помощница на кухне! 💕</div>

    <script>
      // ============================================================
      // 1. ИНИЦИАЛИЗАЦИЯ VK BRIDGE (для кнопки "Поделиться")
      // ============================================================
      VK.init(function () {
        console.log("✅ VK Bridge готов!");
      });

      // ============================================================
      // 2. СОЗДАЁМ 3D СЦЕНУ
      // ============================================================
      const container = document.getElementById("canvas-container");
      const canvas = document.createElement("canvas");
      container.appendChild(canvas);

      const engine = new BABYLON.Engine(canvas, true);
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.94, 0.9, 0.85, 1); // Тёплый кремовый фон

      // Камера (красивая, смотрит на персонажа)
      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        Math.PI / 2,
        Math.PI / 2.4,
        4.5,
        new BABYLON.Vector3(0, 1.2, 0),
        scene,
      );
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 3;
      camera.upperRadiusLimit = 6;
      camera.wheelPrecision = 50;

      // Освещение (как в студии)
      const hemisphericLight = new BABYLON.HemisphericLight(
        "light1",
        new BABYLON.Vector3(0, 1, 0),
        scene,
      );
      hemisphericLight.intensity = 0.7;
      hemisphericLight.diffuse = new BABYLON.Color3(1, 0.95, 0.9);

      const fillLight = new BABYLON.DirectionalLight(
        "light2",
        new BABYLON.Vector3(-1, 0.5, 1),
        scene,
      );
      fillLight.intensity = 0.5;

      const backLight = new BABYLON.DirectionalLight(
        "light3",
        new BABYLON.Vector3(1, 0.3, -1),
        scene,
      );
      backLight.intensity = 0.3;

      // ============================================================
      // 3. СОЗДАЁМ ДЕВУШКУ ИЗ ПРИМИТИВОВ (ПОКА БЕЗ ЗАГРУЗКИ)
      // ============================================================
      // Тело (платье)
      const body = BABYLON.MeshBuilder.CreateCylinder(
        "body",
        { height: 1.0, diameterTop: 0.3, diameterBottom: 0.5 },
        scene,
      );
      body.position.y = 0.5;
      body.material = new BABYLON.StandardMaterial("bodyMat", scene);
      body.material.diffuseColor = new BABYLON.Color3(0.95, 0.7, 0.8); // Розовое платье

      // Голова
      const head = BABYLON.MeshBuilder.CreateSphere(
        "head",
        { diameter: 0.28 },
        scene,
      );
      head.position.y = 1.3;
      head.material = new BABYLON.StandardMaterial("headMat", scene);
      head.material.diffuseColor = new BABYLON.Color3(0.98, 0.92, 0.88); // Светлая кожа

      // Глаза (точки)
      const eyeMat = new BABYLON.StandardMaterial("eyeMat", scene);
      eyeMat.diffuseColor = new BABYLON.Color3(0.1, 0.3, 0.5);
      const eyeL = BABYLON.MeshBuilder.CreateSphere(
        "eyeL",
        { diameter: 0.06 },
        scene,
      );
      eyeL.position = new BABYLON.Vector3(-0.1, 1.38, 0.25);
      eyeL.material = eyeMat;
      const eyeR = BABYLON.MeshBuilder.CreateSphere(
        "eyeR",
        { diameter: 0.06 },
        scene,
      );
      eyeR.position = new BABYLON.Vector3(0.1, 1.38, 0.25);
      eyeR.material = eyeMat;

      // Волосы (просто шар немного сверху)
      const hairMat = new BABYLON.StandardMaterial("hairMat", scene);
      hairMat.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.15);
      const hair = BABYLON.MeshBuilder.CreateSphere(
        "hair",
        { diameter: 0.35, segments: 8 },
        scene,
      );
      hair.position = new BABYLON.Vector3(0, 1.45, -0.05);
      hair.scaling = new BABYLON.Vector3(1, 0.6, 1);
      hair.material = hairMat;

      // ============================================================
      // 4. КУХНЯ (СТОЛ + СТУЛ)
      // ============================================================
      // Стол
      const tableMat = new BABYLON.StandardMaterial("tableMat", scene);
      tableMat.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.3);
      const tableTop = BABYLON.MeshBuilder.CreateBox(
        "tableTop",
        { width: 1.2, height: 0.08, depth: 0.8 },
        scene,
      );
      tableTop.position = new BABYLON.Vector3(1.2, 0.6, -0.5);
      tableTop.material = tableMat;
      const tableLeg = BABYLON.MeshBuilder.CreateBox(
        "tableLeg",
        { width: 0.06, height: 0.5, depth: 0.06 },
        scene,
      );
      tableLeg.position = new BABYLON.Vector3(1.2, 0.25, -0.5);
      tableLeg.material = tableMat;

      // Пол (красивый деревянный)
      const floorMat = new BABYLON.StandardMaterial("floorMat", scene);
      floorMat.diffuseColor = new BABYLON.Color3(0.85, 0.75, 0.6);
      const floor = BABYLON.MeshBuilder.CreateGround(
        "floor",
        { width: 6, height: 6 },
        scene,
      );
      floor.position.y = -0.01;
      floor.material = floorMat;

      // ============================================================
      // 5. АНИМАЦИЯ (ПОКАЧИВАНИЕ)
      // ============================================================
      let time = 0;

      // ============================================================
      // 6. РЕНДЕРИНГ
      // ============================================================
      engine.runRenderLoop(() => {
        time += 0.025;
        // Лёгкое покачивание тела (переминание)
        body.rotation.z = Math.sin(time * 1.2) * 0.05;
        body.position.y = 0.5 + Math.sin(time * 1.5) * 0.02;
        head.rotation.z = Math.sin(time * 1.2) * 0.03;
        // Моргание (глаза)
        const blink = Math.sin(time * 3) > 0.95 ? 0.1 : 0.06;
        eyeL.scaling.y = blink;
        eyeR.scaling.y = blink;
        scene.render();
      });

      window.addEventListener("resize", () => engine.resize());

      // ============================================================
      // 7. VK КНОПКА "ПОДЕЛИТЬСЯ"
      // ============================================================
      const shareBtn = document.createElement("button");
      shareBtn.innerText = "💕 Позвать подружку к себе";
      shareBtn.style.cssText = `
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 20; padding: 12px 24px; border: none; border-radius: 30px;
            background: #ff6b8a; color: white; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 107, 138, 0.4);
            transition: all 0.2s;
            font-family: 'Segoe UI', sans-serif;
        `;
      shareBtn.onmouseover = () => {
        shareBtn.style.transform = "translateX(-50%) scale(1.05)";
      };
      shareBtn.onmouseout = () => {
        shareBtn.style.transform = "translateX(-50%) scale(1)";
      };
      shareBtn.onclick = function () {
        VK.callMethod("showInviteBox", {
          text: "Загляни к моей подружке на кухню! 💕",
        });
      };
      document.body.appendChild(shareBtn);

      console.log("🌍 Милая Подружка запущена!");
    </script>
  </body>
</html>
